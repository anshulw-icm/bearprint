name: Bearprint daily compute

on:
  schedule:
    # Runs at 10:30 UTC = 4:00 PM IST (market closes 3:30 PM IST)
    - cron: "30 10 * * 1-5"   # Mon–Fri only

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Date to compute (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

jobs:
  compute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bearprint compute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.trade_date }}" ]; then
            python -c "
          from compute import run
          from datetime import date
          run(date.fromisoformat('${{ github.event.inputs.trade_date }}'))
          "
          else
            python compute.py
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Bearprint compute failed. Check NSE Bhavcopy availability."
          # Add Slack/email webhook here if needed
